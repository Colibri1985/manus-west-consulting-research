components:
  securitySchemes:
    ScopedBearer:
      type: http
      scheme: bearer
  schemas:
    JobRequest:
      type: object
      additionalProperties: false
      required:
      - message_revision_id
      - profile_id
      - delivery_format
      properties:
        message_revision_id:
          type: string
          minLength: 1
        profile_id:
          type: string
          minLength: 1
        delivery_format:
          type: string
          enum:
          - telegram_voice
          - audio_file
    SelectionRequest:
      type: object
      additionalProperties: false
      required:
      - profile_id
      - expected_version
      properties:
        profile_id:
          type: string
          minLength: 1
        expected_version:
          type: integer
          minimum: 0
    PreviewRequest:
      type: object
      additionalProperties: false
      required:
      - profile_id
      - text
      properties:
        profile_id:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
          maxLength: 4000
      description: Trusted preview operation only. Server materializes scoped synthetic
        message+projection atomically with idempotent acceptance; no Honcho ingestion.
    CancelRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version:
          type: integer
          minimum: 0
    DeliveryRequest:
      type: object
      additionalProperties: false
      required:
      - audio_artifact_id
      - target_binding_ref
      properties:
        audio_artifact_id:
          type: string
          minLength: 1
        target_binding_ref:
          type: string
          minLength: 1
    SafeError:
      type: object
      required:
      - code
      - correlation_id
      properties:
        code:
          type: string
          minLength: 1
        correlation_id:
          type: string
          minLength: 1
        job_id:
          type: string
          minLength: 1
        retry_classification:
          type: string
      additionalProperties: false
    Receipt:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - version
      - audio_artifact_id
      properties:
        id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
          - queued
          - sending
          - delivered
          - failed
          - unknown
          - cancelled
        version:
          type: integer
          minimum: 1
        audio_artifact_id:
          type: string
          minLength: 1
        channel_receipt_ref:
          type: string
          minLength: 1
        error:
          $ref: '#/components/schemas/SafeError'
    ProfileSummary:
      type: object
      required:
      - id
      - revision
      - enabled
      properties:
        id:
          type: string
        revision:
          type: integer
        enabled:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
        readiness:
          type: string
    ProfileList:
      type: object
      required:
      - profiles
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSummary'
      description: Finite authorized registry returned in full in v3.3; no pagination
        contract in this release.
    Selection:
      type: object
      required:
      - profile_id
      - version
      - profile_revision
      - effective_from
      - application_status
      properties:
        profile_id:
          type: string
          minLength: 1
        profile_revision:
          type: integer
        version:
          type: integer
        effective_from:
          type: string
          enum:
          - next_reply
        application_status:
          type: string
      additionalProperties: false
    JobStatus:
      type: object
      required:
      - job_id
      - status
      - version
      - profile_id
      - profile_revision
      - billing_status
      - delivery_status
      properties:
        job_id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
          - CREATED
          - VALIDATING
          - QUEUED
          - DISPATCH_INTENT
          - SYNTHESIZING
          - AUDIO_VALIDATING
          - READY
          - FAILED
          - BLOCKED
          - PARTIAL
          - CANCEL_REQUESTED
          - CANCELLED
          - OUTCOME_UNKNOWN
        audio_artifact_id:
          type: string
          minLength: 1
        billing_status:
          type: string
          enum:
          - not_required
          - reserved
          - settled
          - unknown
        delivery_status:
          type: string
          enum:
          - not_requested
          - queued
          - sending
          - delivered
          - failed
          - unknown
        error:
          $ref: '#/components/schemas/SafeError'
        version:
          type: integer
          minimum: 1
        profile_id:
          type: string
          minLength: 1
        profile_revision:
          type: integer
          minimum: 1
        audio_metadata:
          $ref: '#/components/schemas/AudioMetadata'
      additionalProperties: false
      oneOf:
      - properties:
          status:
            enum:
            - READY
        required:
        - audio_artifact_id
        - audio_metadata
      - properties:
          status:
            enum:
            - CREATED
            - VALIDATING
            - QUEUED
            - DISPATCH_INTENT
            - SYNTHESIZING
            - AUDIO_VALIDATING
            - FAILED
            - BLOCKED
            - PARTIAL
            - CANCEL_REQUESTED
            - CANCELLED
            - OUTCOME_UNKNOWN
    AudioMetadata:
      type: object
      additionalProperties: false
      required:
      - sha256
      - codec
      - container
      - duration_seconds
      - sample_rate_hz
      - channels
      properties:
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        codec:
          type: string
          minLength: 1
        container:
          type: string
          minLength: 1
        duration_seconds:
          type: number
          minimum: 0
        sample_rate_hz:
          type: integer
          minimum: 1
        channels:
          type: integer
          minimum: 1
