name: athena-honcho
services:
  database:
    restart: unless-stopped
    security_opt: &id001
    - no-new-privileges:true
    logging: &id002
      driver: local
      options:
        max-size: 10m
        max-file: '5'
        compress: 'true'
    image: ${HONCHO_POSTGRES_IMAGE:?required}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: honcho
      POSTGRES_PASSWORD_FILE: /run/secrets/honcho_admin_password
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
    - honcho_admin_password
    - honcho_db_password
    volumes:
    - pgdata:/var/lib/postgresql/data
    - type: bind
      source: ./database/init_honcho.sh
      target: /docker-entrypoint-initdb.d/01-app.sh
      read_only: true
      bind:
        create_host_path: false
    stop_grace_period: 120s
    shm_size: 256m
    mem_limit: ${HONCHO_DB_MEMORY:?required}
    cpus: ${HONCHO_DB_CPUS:?required}
    pids_limit: 256
    networks:
    - db
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d honcho
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
  redis:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    image: ${REDIS_IMAGE:?required}
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --appendfsync
    - everysec
    - --maxmemory
    - ${REDIS_MAXMEMORY:?required}
    - --maxmemory-policy
    - noeviction
    volumes:
    - redisdata:/data
    mem_limit: ${REDIS_MEMORY:?required}
    cpus: ${REDIS_CPUS:?required}
    pids_limit: 128
    stop_grace_period: 60s
    networks:
    - cache
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
  api:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    image: ${HONCHO_IMAGE:?required}
    env_file: &id003
    - ./env/honcho.env
    entrypoint: &id004
    - /app/.venv/bin/python
    - /deployment/bootstrap_honcho.py
    init: true
    stop_grace_period: 120s
    volumes: &id005
    - type: bind
      source: ./scripts/bootstrap_honcho.py
      target: /deployment/bootstrap_honcho.py
      read_only: true
      bind:
        create_host_path: false
    secrets: &id006
    - honcho_db_password
    - honcho_jwt_secret
    - honcho_openrouter_key
    networks:
      db: {}
      cache: {}
      inference_egress: {}
      memory_api:
        aliases:
        - honcho-api
    command:
    - api
    ports:
    - 127.0.0.1:18000:8000
    mem_limit: ${HONCHO_API_MEMORY:?required}
    cpus: ${HONCHO_API_CPUS:?required}
    pids_limit: 256
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
  deriver:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    image: ${HONCHO_IMAGE:?required}
    env_file: *id003
    entrypoint: *id004
    init: true
    stop_grace_period: 120s
    volumes: *id005
    secrets: *id006
    networks:
    - db
    - cache
    - inference_egress
    command:
    - deriver
    mem_limit: ${HONCHO_DERIVER_MEMORY:?required}
    cpus: ${HONCHO_DERIVER_CPUS:?required}
    pids_limit: 256
    depends_on:
      api:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  pgdata:
    external: true
    name: athena_honcho_pgdata
  redisdata:
    external: true
    name: athena_honcho_redisdata
secrets:
  honcho_admin_password:
    file: ${SECRET_DIR:?required}/honcho_admin_password
  honcho_db_password:
    file: ${SECRET_DIR:?required}/honcho_db_password
  honcho_jwt_secret:
    file: ${SECRET_DIR:?required}/honcho_jwt_secret
  honcho_openrouter_key:
    file: ${SECRET_DIR:?required}/honcho_openrouter_key
networks:
  db:
    internal: true
  cache:
    internal: true
  inference_egress: {}
  memory_api:
    external: true
    name: athena_memory_api
