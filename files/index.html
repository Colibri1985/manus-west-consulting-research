<style>
:root{--bg:#101719;--panel:#182124;--panel2:#1e292c;--line:#2c383b;--text:#edf0e9;--muted:#a3b1af;--gold:#d8bd81;--green:#9cccb7;--red:#e6a5a0;--blue:#a5bfd9;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button,a,input,select{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold)}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 14px}button:hover{border-color:#7b877e}a{color:var(--gold)}.primary{background:var(--gold);color:#202820;border-color:var(--gold);font-weight:650}.ghost{background:transparent}.layout{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.sidebar{padding:30px 20px;border-right:1px solid var(--line);background:#131c1f;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;margin:0 10px 34px}.seal{width:42px;height:42px;border:1px solid var(--gold);color:var(--gold);border-radius:50%;display:grid;place-items:center;font:27px Georgia,serif}.brand strong{font:26px Georgia,serif}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold)}.sidebar nav{display:grid;gap:6px}.nav{display:flex;align-items:center;gap:13px;text-align:left;border-color:transparent;background:transparent;color:var(--muted);padding:12px 15px}.nav span:first-child{width:20px;text-align:center}.nav.active{background:#2b332d;color:var(--gold);border-color:#424735}.side-bottom{margin-top:auto;padding-top:25px}.local-note{font-size:12px;color:var(--muted);padding:15px 10px;border-top:1px solid var(--line)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:6px}.profile{display:flex;align-items:center;gap:10px;padding:14px 8px}.avatar{width:32px;height:32px;border-radius:50%;background:#303b35;color:var(--gold);display:grid;place-items:center}main{min-width:0;padding:0 42px 35px;max-width:1600px;width:100%;margin:auto}.topbar{display:flex;align-items:center;gap:18px;padding:23px 0;border-bottom:1px solid var(--line)}.breadcrumb{font-size:13px;color:var(--muted)}.search{margin-left:auto;width:min(380px,48%);position:relative}.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 14px}.searchbox{position:absolute;top:48px;right:0;width:min(480px,80vw);background:var(--panel2);border:1px solid var(--line);border-radius:12px;z-index:9;padding:10px;box-shadow:0 15px 40px #0006}.searchbox button{display:block;width:100%;text-align:left;margin:4px 0}.searchbox:empty{display:none}.demo{font-size:11px;border:1px solid #6a5d3d;color:var(--gold);border-radius:6px;padding:4px 7px;white-space:nowrap}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:30px 0 22px}.heading h1{font:clamp(29px,3vw,40px)/1.15 Georgia,serif;margin:8px 0 10px;font-weight:400}.heading p{margin:0;color:var(--muted);max-width:680px}.date{font-size:12px;color:var(--muted);margin-bottom:8px}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;min-width:0}.metric{font-size:30px;letter-spacing:-1px;margin:9px 0 2px}.muted{color:var(--muted)}.small{font-size:12px}.columns{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:20px}.card-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.card-title h2{font-size:16px;font-weight:600;margin:0}h3{font-size:16px;margin:0 0 8px}.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.grow{flex:1;min-width:0}.row p{margin:3px 0 0}.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:6px;background:#293531;color:var(--green);white-space:nowrap}.tag.gold{background:#3b3528;color:var(--gold)}.tag.blue{background:#293540;color:var(--blue)}.tag.red{background:#3b2c2e;color:var(--red)}.tag.neutral{background:#293235;color:var(--muted)}.check{width:19px;height:19px;accent-color:var(--gold);flex-shrink:0}.done{text-decoration:line-through;color:var(--muted)}.insight{background:linear-gradient(125deg,#2b342e,#1b2627);border-color:#465044}.insight blockquote{font:21px/1.45 Georgia,serif;margin:16px 0;color:#e4e9db}.stack{display:grid;gap:18px;align-content:start}.progress{height:5px;border-radius:6px;background:#303c3e;margin:13px 0 7px;overflow:hidden}.progress i{display:block;height:100%;background:var(--gold);border-radius:6px}.project-grid{grid-template-columns:repeat(3,1fr)}.project-card{display:flex;flex-direction:column;gap:10px}.project-card .description{color:var(--muted);font-size:13px;flex:1}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.filter.active{background:#343e34;border-color:#7e805c;color:var(--gold)}.section-label{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:28px 0 12px}.tiles{grid-template-columns:repeat(3,1fr)}.tile-icon{font:26px Georgia,serif;color:var(--gold);margin-bottom:16px}.card p{margin-top:7px}.bullets{padding-left:19px;color:var(--muted);font-size:13px}.bullets li{margin-bottom:7px}.notice{border:1px solid #4f503c;background:#262c25;border-radius:12px;padding:13px 16px;color:#d5d6b9;font-size:13px;margin-bottom:20px}.footer{color:var(--muted);font-size:11px;border-top:1px solid var(--line);padding-top:18px;margin-top:30px;display:flex;justify-content:space-between;gap:12px}.linkbutton{border:0;background:transparent;padding:0;color:var(--gold);font-size:13px}.time{min-width:48px;color:var(--gold);font-size:13px}.agenda{border-left:2px solid #53614c;padding-left:14px}.empty{color:var(--muted);padding:20px;text-align:center}.vault-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.vault-bar input,.form input,.form select{background:#10191c;border:1px solid var(--line);color:var(--text);padding:11px 13px;border-radius:9px;min-width:0}.vault-bar input{flex:1}.security{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.security .card{padding:16px}.security h3{font-size:13px}.black{border-top:3px solid #858b97}.red-border{border-top:3px solid var(--red)}.yellow-border{border-top:3px solid var(--gold)}.green-border{border-top:3px solid var(--green)}dialog{background:var(--panel);color:var(--text);border:1px solid #53605c;border-radius:20px;padding:26px;width:min(620px,calc(100% - 28px));max-height:90vh;overflow:auto}dialog::backdrop{background:#071013b8;backdrop-filter:blur(5px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:20px}.dialog-head h2{font:27px Georgia,serif;margin:0}.form{display:grid;gap:15px;margin-top:20px}.form label{display:grid;gap:7px;font-size:13px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.detail-list{display:grid;gap:12px;margin:20px 0}.detail-list>div{padding-bottom:12px;border-bottom:1px solid var(--line)}.detail-list strong{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-bottom:4px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:13px 20px;background:#e5d6ae;color:#19211e;border-radius:11px;box-shadow:0 8px 30px #0005;z-index:30;max-width:90vw}.cash-chart{display:flex;align-items:end;gap:20px;height:160px;padding:20px 10px 0}.bar-wrap{flex:1;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:flex-end;font-size:11px;color:var(--muted)}.bar{background:#6d8d7e;border-radius:7px 7px 0 0;min-height:5px;margin-bottom:7px}.bar.alt{background:var(--gold)}[hidden]{display:none!important}@media(min-width:1500px){main{padding-left:55px;padding-right:55px}}@media(max-width:1150px){main{padding:0 25px 25px}.layout{grid-template-columns:195px 1fr}.sidebar{padding:25px 12px}.project-grid,.tiles{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.layout{display:block}.sidebar{position:static;height:auto;padding:14px;border-right:0;border-bottom:1px solid var(--line)}.brand{margin:0 5px 15px}.brand strong{font-size:23px}.sidebar nav{display:flex;overflow:auto;gap:5px}.nav{padding:9px 12px;white-space:nowrap;font-size:13px}.nav span:first-child,.side-bottom{display:none}main{padding:0 16px 24px}.topbar{padding:15px 0;gap:8px}.breadcrumb{display:none}.search{margin-left:0;width:auto;flex:1}.heading{margin-top:23px;align-items:start}.heading{flex-wrap:wrap}.stats{gap:10px}.card{padding:17px}.metric{font-size:26px}.project-grid,.tiles{grid-template-columns:1fr}.security{grid-template-columns:repeat(2,1fr)}.footer{flex-direction:column}.row{gap:10px}.card-title{flex-wrap:wrap}.demo{font-size:10px}}

<body>
<div class="layout">
<aside class="sidebar"><div class="brand"><div class="seal">Α</div><div><strong>Афина</strong><div class="eyebrow">Личный центр управления</div></div></div>
<nav aria-label="Разделы"><button class="nav active" data-page="home"><span>◈</span><span>Главное</span></button><button class="nav" data-page="personal"><span>◉</span><span>Личное</span></button><button class="nav" data-page="projects"><span>▦</span><span>Проекты</span></button><button class="nav" data-page="workshop"><span>⌘</span><span>Мастерская</span></button><button class="nav" data-page="finance"><span>↗</span><span>Финансы</span></button><button class="nav" data-page="knowledge"><span>▤</span><span>Знания</span></button></nav>
<div class="side-bottom"><div class="local-note"><span class="dot"></span>Автономный прототип<br>Внешние сервисы не подключены</div><div class="profile"><div class="avatar">А</div><div class="grow">Андрей<div class="small muted">Владелец системы</div></div><button id="settings" class="ghost" aria-label="О прототипе и данные">⚙</button></div></div></aside>
<main><header class="topbar"><div class="breadcrumb">Личное пространство / <span id="crumb">Главное</span></div><div class="search"><input id="globalSearch" aria-label="Поиск разделов и демопроектов" placeholder="Найти раздел или проект…" autocomplete="off"><div id="searchResults" class="searchbox"></div></div><span class="demo">ПРОТОТИП · ДЕМО</span></header>
<div id="content"></div><footer class="footer"><span>Афина · Сначала ясность, затем действие.</span><span>Все записи и показатели — демонстрационные. Реальных подключений нет.</span></footer></main></div>
<dialog id="modal"><div class="dialog-head"><h2 id="modalTitle"></h2><button id="closeModal" class="ghost" aria-label="Закрыть окно">✕</button></div><div id="modalBody"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const titles={home:'Главное',personal:'Личное',projects:'Проекты',workshop:'Мастерская',finance:'Финансы',knowledge:'Знания'};
const projects=[{id:'P-001',title:'БИТ.ФИНАНС · УК ЖКХ',area:'Финансы',status:'Инициация',stage:'Обследование и рамки проекта',goal:'Сформировать согласованные финансовые требования и план внедрения.',next:'Подготовить карту финансовых процессов',owner:'Андрей · методология и руководство',gate:'Требуют согласования границы, сроки и состав участников.',output:'Паспорт, реестр требований и критерии приёмки',progress:15},{id:'P-002',title:'Афина · управляемая среда',area:'ИИ и разработка',status:'Проектирование',stage:'Конституция и техническая карта',goal:'Создать безопасную среду управления задачами, знаниями и инструментами.',next:'Согласовать матрицу полномочий',owner:'Андрей · владелец; Афина · подготовка',gate:'Не разрешены новые подключения и изменения продуктивной среды.',output:'Конституция, политики и проверяемый roadmap',progress:30},{id:'P-003',title:'MiniApp для звонков',area:'Личное',status:'Идея',stage:'Оценка целесообразности',goal:'Уточнить проблему и полезность приложения до начала разработки.',next:'Определить сценарий и категории данных',owner:'Не назначен',gate:'Разработка не начата. Нужна оценка приватности и стоимости.',output:'Короткий паспорт и решение о запуске',progress:5}];
const baseTasks=[{id:'t1',text:'Согласовать принципы и границы Афины',scope:'Рабочее',done:false},{id:'t2',text:'Набросать карту процессов БИТ.ФИНАНС',scope:'Рабочее',done:false},{id:'t3',text:'Выделить время на обучение',scope:'Личное',done:false}];
const KEY='athena-dashboard-demo-v1';let storageOK=true;
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return structuredClone(baseTasks);const t=JSON.parse(raw);if(!Array.isArray(t)||!t.every(x=>x&&typeof x.id==='string'&&typeof x.text==='string'&&typeof x.done==='boolean'&&['Личное','Рабочее'].includes(x.scope)))throw Error('format');return t;}catch(e){return structuredClone(baseTasks);}}
let tasks=load(),page='home',projectFilter='Все',vault='Рабочий',finScope='Личные',noteQuery='';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));}catch(e){storageOK=false;toast('Хранилище браузера недоступно. Изменения действуют только до закрытия страницы.');}}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,5000);}
function dateText(){return new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());}
function head(k,title,sub,action=''){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${sub}</p></div><div><div class="date">${dateText()} · время устройства</div>${action}</div></div>`;}
function stat(label,value,sub){return `<div class="card"><div class="small muted">${label}</div><div class="metric">${value}</div><div class="small muted">${sub}</div></div>`;}
function taskRows(list){return list.length?list.map(t=>`<div class="row"><input class="check" type="checkbox" data-task="${esc(t.id)}" ${t.done?'checked':''} aria-label="Завершить: ${esc(t.text)}"><div class="grow ${t.done?'done':''}">${esc(t.text)}<div class="small muted">${esc(t.scope)} · пример задачи</div></div><button class="ghost small" data-delete="${esc(t.id)}" aria-label="Удалить задачу: ${esc(t.text)}">×</button></div>`).join(''):'<div class="empty">Задач пока нет. Добавьте первую.</div>';}
function projectCard(p){return `<article class="card project-card"><div class="card-title"><span class="small muted">${p.id} / ${p.area}</span><span class="tag ${p.status==='Идея'?'neutral':'gold'}">${p.status}</span></div><h3>${p.title}</h3><div class="description">${p.goal}</div><div><div class="progress"><i style="width:${p.progress}%"></i></div><div class="small muted">${p.progress}% · условная иллюстрация этапа</div></div><button data-project="${p.id}">Открыть паспорт ↗</button></article>`;}
function home(){return head('Обзор пространства','Главное — перед глазами','Цели, ближайшие действия и решения. Без лишнего шума.','<button class="primary" data-add>＋ Добавить задачу</button>')+`<div class="grid stats">${stat('Проекты в демопортфеле','3','Из них одна идея до решения о запуске')}${stat('Незавершённые задачи',tasks.filter(t=>!t.done).length,'Только в этом прототипе')}${stat('Решение на внимание','1','Пример: рамки проекта Афины')}${stat('Внешние подключения','0','Подключения не имитируются')}</div><div class="columns"><div class="stack"><section class="card"><div class="card-title"><h2>Ближайшие действия</h2><button class="linkbutton" data-add>＋ Задача</button></div>${taskRows(tasks)}</section><section class="card"><div class="card-title"><h2>Портфель в фокусе</h2><button class="linkbutton" data-go="projects">Все проекты →</button></div>${projects.slice(0,2).map(p=>`<div class="row"><div class="grow"><strong>${p.title}</strong><p class="small muted">${p.stage}</p></div><button class="ghost small" data-project="${p.id}">Паспорт</button></div>`).join('')}</section></div><div class="stack"><section class="card insight"><div class="eyebrow">Заметка Афины · пример</div><blockquote>Сначала определить правила и качество данных. Затем расширять самостоятельность.</blockquote><p class="small muted">Следующий управленческий шаг — согласовать рамки проекта, а не добавлять новый сервис.</p><button class="linkbutton" data-go="workshop">Открыть мастерскую →</button></section><section class="card"><div class="card-title"><h2>Пример расписания</h2><span class="tag neutral">Не календарь</span></div><div class="row"><span class="time">10:00</span><div class="agenda"><strong>Фокус: финансы</strong><div class="small muted">Обследование процессов · 60 минут</div></div></div><div class="row"><span class="time">18:30</span><div class="agenda"><strong>Личное время</strong><div class="small muted">Обучение · 30 минут</div></div></div><p class="small muted">События вымышлены. Напоминания не отправляются.</p></section></div></div>`;}
function personal(){return head('Личный контур','Место для жизни, не только работы','Дела, время, обучение и личные проекты — отдельно от корпоративных данных.','<button class="primary" data-add>＋ Личная задача</button>')+`<div class="columns"><div class="stack"><section class="card"><div class="card-title"><h2>Мои дела</h2><span class="tag blue">Личное</span></div>${taskRows(tasks.filter(t=>t.scope==='Личное'))}</section><section class="card"><h2 style="font-size:16px">Планирование недели</h2><p class="muted">Три опоры: обязательства, время для сосредоточенной работы и восстановление.</p><div class="row"><span class="tag gold">Фокус</span><div>Один главный результат на день</div></div><div class="row"><span class="tag blue">Развитие</span><div>Обучение и собственные идеи</div></div><div class="row"><span class="tag">Баланс</span><div>Свободное время без рабочих задач</div></div></section></div><div class="stack"><section class="card"><h3>Почта и календарь</h3><p class="small muted">Будущая сводка писем, встреч и конфликтов расписания.</p><span class="tag neutral">Не подключены</span><p class="small muted">Отправка писем и изменения календаря — отдельные полномочия.</p></section><section class="card"><h3>Поездки и здоровье</h3><p class="small muted">План поездок, вопросы врачу и личные напоминания. В этом прототипе чувствительные данные не собираются.</p><span class="tag red">Нужен защищённый контур</span></section><section class="card"><h3>Личная база знаний</h3><p class="small muted">Перейти к отдельному демонстрационному vault.</p><button data-personal-vault>Открыть личные знания →</button></section></div></div>`;}
function projectView(){const shown=projectFilter==='Все'?projects:projects.filter(p=>p.area===projectFilter);return head('Портфель · Frigga','Проекты с понятными рамками','Сначала паспорт и согласование. Затем исполнение, контроль и приёмка.')+`<div class="notice">Это образец реестра. Статусы, проценты и назначения не отражают фактический ход ваших проектов.</div><div class="toolbar">${['Все','Финансы','ИИ и разработка','Личное'].map(f=>`<button class="filter ${projectFilter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><div class="grid project-grid">${shown.map(projectCard).join('')}</div><div class="section-label">Как проект проходит через систему</div><div class="grid tiles"><div class="card"><div class="eyebrow">01 / Frigga</div><h3>Оформить и согласовать</h3><p class="small muted">Цели, границы, этапы, результаты, участники и допустимые данные.</p></div><div class="card"><div class="eyebrow">02 / Афина</div><h3>Организовать исполнение</h3><p class="small muted">Выбрать разрешённые инструменты и проверить каждый существенный результат.</p></div><div class="card"><div class="eyebrow">03 / Владелец</div><h3>Принять результат</h3><p class="small muted">Получить доказательства, ограничения и вопросы для решения.</p></div></div>`;}
const tools=[['Obsidian','Два раздельных vault: рабочий и личный.'],['Kaiten','Задачи, ответственные, сроки и блокировки.'],['GitHub','Код, тесты и инженерная история.'],['Модели и поиск','OpenAI, Anthropic, Perplexity; другие — по необходимости.'],['1С · БИТ.ФИНАНС','Методология, согласованные выгрузки и тестовый контур.'],['VPS · Россия / США','Размещение только после определения доверенных контуров.']];
function workshop(){return head('Инструменты и процедуры','Мастерская Афины','Здесь выбирается способ работы — не расширяются полномочия.')+`<div class="notice">Карта целевой системы. Навыки ниже описаны концептуально; этот HTML их не запускает и ничего не отправляет.</div><div class="grid tiles">${[['Frigga','Рождение и контроль проектов','Паспорт → реестр → контроль границ'],['Mimir','Проверяемые технические факты','Источник → извлечение → подтверждение'],['Saga','Бизнес- и системный анализ','Требование → интерпретация → сценарий'],['Heimdall','Проверка качества и доказательств','Критерий → проверка → замечания']].map((x,i)=>`<article class="card"><div class="tile-icon">${['◈','⌕','≋','◇'][i]}</div><h3>${x[0]}</h3><p class="muted">${x[1]}</p><p class="small muted">${x[2]}</p><button data-skill="${x[0]}">Посмотреть процедуру</button></article>`).join('')}</div><div class="section-label">Подключения · все отключены</div><div class="grid tiles">${tools.map(t=>`<div class="card"><div class="card-title"><h3>${t[0]}</h3><span class="tag neutral">Нет связи</span></div><p class="small muted">${t[1]}</p></div>`).join('')}</div><div class="section-label">Политика данных · целевые правила, не техническая защита HTML</div>${securityCards()}`;}
function securityCards(){return `<div class="security"><div class="card black"><h3>BLACK</h3><p class="small muted">Секреты не показывать никакой модели.</p></div><div class="card red-border"><h3>RED</h3><p class="small muted">Только утверждённый закрытый контур.</p></div><div class="card yellow-border"><h3>YELLOW</h3><p class="small muted">Наружу — только проверенная разрешённая копия.</p></div><div class="card green-border"><h3>GREEN</h3><p class="small muted">Разрешённая обработка. Не разрешение на внешнее действие.</p></div></div>`;}
function finance(){return head('Финансовая панель','Цифры с контекстом','Личный и корпоративный контуры разделены. Здесь — только синтетический пример.')+`<div class="toolbar">${['Личные','Корпоративные'].map(x=>`<button class="filter ${finScope===x?'active':''}" data-fin="${x}">${x}</button>`).join('')}</div>`+(finScope==='Личные'?`<div class="notice">Учебный месяц, RUB. Все суммы вымышлены. Не являются сведениями о ваших доходах или расходах.</div><div class="grid stats">${stat('Доходы','300 000 ₽','Синтетический пример / месяц')}${stat('Расходы','180 000 ₽','Синтетический пример / месяц')}${stat('Остаток потока','120 000 ₽','Доходы минус расходы')}${stat('Доля остатка','40%','120 000 / 300 000')}</div><div class="columns"><section class="card"><h3>Денежный поток · учебный месяц</h3><div class="cash-chart"><div class="bar-wrap"><div class="bar" style="height:120px"></div>Доходы · 300 тыс.</div><div class="bar-wrap"><div class="bar alt" style="height:72px"></div>Расходы · 180 тыс.</div><div class="bar-wrap"><div class="bar" style="height:48px"></div>Остаток · 120 тыс.</div></div></section><section class="card"><h3>Что войдёт в реальную панель</h3><ul class="bullets"><li>Бюджет и план-факт по категориям.</li><li>Ликвидность и предстоящие обязательства.</li><li>Цели накоплений и финансовые сценарии.</li><li>Период, источник и дата обновления каждого показателя.</li></ul><span class="tag red">Реальные выписки сюда не загружать</span></section></div>`:`<div class="notice">Корпоративные показатели не загружены. Рабочие финансовые данные требуют отдельного разрешённого контура.</div><div class="grid tiles">${[['Бюджетирование','План-факт, прогноз и причины отклонений.'],['Казначейство','Платёжный календарь и ликвидность.'],['Управленческая отчётность','P&L, баланс, денежный поток и сверки.']].map(t=>`<section class="card"><h3>${t[0]}</h3><p class="muted">${t[1]}</p><span class="tag neutral">Нет данных</span></section>`).join('')}</div><p><button data-project="P-001">Открыть проект БИТ.ФИНАНС →</button></p>`);}
const notes=[{vault:'Рабочий',title:'Карта финансовых процессов',kind:'Методология',text:'Шаблон обследования: процесс, участники, документы, ограничения.',class:'YELLOW'},{vault:'Рабочий',title:'Реестр требований к внедрению',kind:'Требования',text:'Шаблон: источник требования, критерий приёмки и подтверждение.',class:'YELLOW'},{vault:'Рабочий',title:'Сценарии проверки',kind:'Качество',text:'Шаблон связки требования, реализации, теста и решения.',class:'GREEN'},{vault:'Личный',title:'Принципы моей AI-среды',kind:'Архитектура',text:'Демонстрационная заметка о контролируемом делегировании.',class:'YELLOW'},{vault:'Личный',title:'План обучения',kind:'Развитие',text:'Пример структуры тем: финансы, ИИ, разработка и данные.',class:'GREEN'},{vault:'Личный',title:'Идеи личных проектов',kind:'Идеи',text:'Безопасные краткие описания до решения о запуске.',class:'GREEN'}];
function noteCards(){const list=notes.filter(n=>n.vault===vault&&(n.title+' '+n.kind).toLowerCase().includes(noteQuery.toLowerCase()));return list.length?list.map(n=>`<article class="card"><div class="card-title"><span class="small muted">${n.kind}</span><span class="tag ${n.class==='YELLOW'?'gold':''}">${n.class}</span></div><h3>${n.title}</h3><p class="small muted">${n.text}</p><button data-note="${notes.indexOf(n)}">Открыть пример</button></article>`).join(''):'<div class="empty">В выбранном vault ничего не найдено.</div>';}
function knowledge(){return head('Раздельные базы знаний','Знания, которые можно найти','Выбираем один vault. Реальные файлы Obsidian не подключены.')+`<div class="vault-bar">${['Рабочий','Личный'].map(x=>`<button class="filter ${vault===x?'active':''}" data-vault="${x}">${x==='Рабочий'?'▦':'◉'} ${x} vault</button>`).join('')}<input id="noteSearch" aria-label="Поиск в выбранном демонстрационном vault" placeholder="Поиск только в выбранном vault…" value="${esc(noteQuery)}"></div><div class="notice">${vault==='Рабочий'?'Рабочий контур · внедрение БИТ.ФИНАНС.':'Личный контур · знания и личные проекты.'} Все карточки — демонстрационные шаблоны, не прочитанные заметки. Цвета иллюстрируют политику, а не реальную проверку.</div><div id="notes" class="grid tiles">${noteCards()}</div><div class="section-label">Правило доступа</div><section class="card"><h3>Минимальный контекст вместо загрузки всего vault</h3><p class="muted">Выбор проекта → разрешённые заметки → проверка данных → допустимый маршрут. Перенос между vault требует отдельного разрешения.</p></section>`;}
function render(){const views={home,personal,projects:projectView,workshop,finance,knowledge};$('#content').innerHTML=views[page]();$('#crumb').textContent=titles[page];document.querySelectorAll('[data-page]').forEach(b=>{const active=b.dataset.page===page;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});document.title=titles[page]+' · Афина';}
function go(p){if(!titles[p])return;page=p;$('#globalSearch').value='';$('#searchResults').innerHTML='';render();window.scrollTo({top:0,behavior:'smooth'});}
function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').showModal();}
function showProject(id){const p=projects.find(x=>x.id===id);if(!p)return;modal(p.title,`<p class="small muted">${p.id} · Демонстрационный паспорт Frigga</p><div class="detail-list">${[['Цель',p.goal],['Этап',p.stage],['Границы','Только подготовка и согласование; без изменений рабочих систем.'],['Результат',p.output],['Ответственность · пример',p.owner],['Сроки','Не определены. Требуют согласования.'],['Следующее действие',p.next],['Контрольный барьер',p.gate]].map(x=>`<div><strong>${x[0]}</strong>${x[1]}</div>`).join('')}</div><button class="primary" data-project-task="${p.id}">Добавить следующий шаг в демозадачи</button>`);}
function addTask(){modal('Новая задача',`<p class="small muted">Локальная демозапись. Не вводите секреты, медицинские, банковские или корпоративные данные.</p><form id="taskForm" class="form"><label>Что нужно сделать<input id="taskText" required maxlength="140" placeholder="Например, подготовить вопросы к встрече" autocomplete="off"></label><label>Контур<select id="taskScope"><option ${page==='personal'?'selected':''}>Личное</option><option ${page!=='personal'?'selected':''}>Рабочее</option></select></label><div class="actions"><button type="button" data-cancel>Отмена</button><button class="primary" type="submit">Добавить</button></div></form>`);$('#taskText').focus();$('#taskForm').addEventListener('submit',e=>{e.preventDefault();const text=$('#taskText').value.trim();if(!text){$('#taskText').setCustomValidity('Введите непустую задачу');$('#taskText').reportValidity();return;}tasks.push({id:'u'+Date.now()+Math.random().toString(36).slice(2),text,scope:$('#taskScope').value,done:false});save();$('#modal').close();render();toast(storageOK?'Демозадача сохранена в этом браузере.':'Задача добавлена только на время сеанса.');});$('#taskText').addEventListener('input',e=>e.target.setCustomValidity(''));}
const skillText={Frigga:'Отличить новый проект от задачи или части существующего проекта. Сформировать паспорт, этапы, результаты, ограничения и вопросы. Зарегистрировать и передать на согласование. Не выполнять проектные работы самостоятельно.',Mimir:'Определить разрешённые источники. Извлечь факты, зафиксировать происхождение и версию. Указать пробелы. Не выдавать наличие объекта за соответствие бизнес-требованию.',Saga:'Сопоставить требование с подтверждёнными фактами. Сформировать интерпретацию, GAP-вопрос и сценарий проверки. Не придумывать отсутствующие технические подтверждения.',Heimdall:'Проверить критерии приёмки, доказательства и результаты тестов. Отметить замечания и ограничения. Самопроверка модели не равна независимому аудиту.'};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)go(b.dataset.page);if(b.dataset.go)go(b.dataset.go);if(b.hasAttribute('data-add'))addTask();if(b.dataset.project)showProject(b.dataset.project);if(b.dataset.filter){projectFilter=b.dataset.filter;render();}if(b.dataset.fin){finScope=b.dataset.fin;render();}if(b.dataset.vault){vault=b.dataset.vault;noteQuery='';render();}if(b.hasAttribute('data-personal-vault')){vault='Личный';noteQuery='';go('knowledge');}if(b.dataset.delete){tasks=tasks.filter(t=>t.id!==b.dataset.delete);save();render();}if(b.hasAttribute('data-cancel'))$('#modal').close();if(b.dataset.skill)modal(b.dataset.skill,`<p>${skillText[b.dataset.skill]}</p><div class="notice">Описание процедуры, не запуск агента. Внешних вызовов нет.</div>`);if(b.dataset.note!==undefined){const n=notes[Number(b.dataset.note)];if(n&&n.vault===vault)modal(n.title,`<span class="tag">${n.vault} vault · шаблон</span><p>${n.text}</p><p class="muted">В реальной системе здесь будут источник, версия, владелец, класс данных и разрешённые действия. Этот пример не является содержимым вашего Obsidian.</p>`);}if(b.dataset.projectTask){const p=projects.find(x=>x.id===b.dataset.projectTask);if(tasks.some(t=>t.text===p.next)){toast('Такой следующий шаг уже добавлен.');return;}tasks.push({id:'p'+p.id,text:p.next,scope:p.area==='Личное'?'Личное':'Рабочее',done:false});save();$('#modal').close();render();toast('Следующий шаг добавлен только в демозадачи.');}if(b.id==='resetData'){modal('Сбросить демоданные?',`<p>Будут удалены только задачи, добавленные в этом прототипе, и восстановлены исходные примеры. Внешние системы не затрагиваются.</p><div class="actions"><button data-cancel>Отмена</button><button id="confirmReset" class="primary">Сбросить</button></div>`);}if(b.id==='confirmReset'){tasks=structuredClone(baseTasks);save();$('#modal').close();render();toast('Демонстрационные задачи восстановлены.');}});
document.addEventListener('change',e=>{if(e.target.dataset.task){const t=tasks.find(x=>x.id===e.target.dataset.task);if(t){t.done=e.target.checked;save();render();}}});
document.addEventListener('input',e=>{if(e.target.id==='noteSearch'){noteQuery=e.target.value;$('#notes').innerHTML=noteCards();}});
$('#globalSearch').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(!q){$('#searchResults').innerHTML='';return;}const sections=Object.entries(titles).filter(([k,v])=>v.toLowerCase().includes(q)).map(([k,v])=>`<button data-go="${k}">Раздел · ${v}</button>`);const ps=projects.filter(p=>p.title.toLowerCase().includes(q)).map(p=>`<button data-project="${p.id}">Демопроект · ${p.title}</button>`);$('#searchResults').innerHTML=sections.join('')+ps.join('')||'<div class="small muted">Ничего не найдено. Поиск не обращается к vault или внешним сервисам.</div>';});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#searchResults').innerHTML='';});
$('#closeModal').onclick=()=>$('#modal').close();
$('#settings').onclick=()=>modal('О прототипе',`<p>Единый автономный HTML. Без библиотек, сетевых запросов, аналитики и реальных интеграций.</p><p class="muted">Сохраняется только список демозадач в localStorage этого браузера. Это не защищённое хранилище и не синхронизация. В некоторых браузерах для локальных файлов сохранение может быть ограничено.</p><p class="muted">Ни память Hermes, ни Obsidian, Kaiten, GitHub и другие сервисы этот файл не читает и не изменяет.</p><button id="resetData">Сбросить демозадачи</button>`);
render();
</script>
</body>
</html>
